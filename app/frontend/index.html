<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aquilate — Workspace</title>
  <link rel="icon" href="imgs/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    if (localStorage.getItem('aquilate_onboarded') !== 'true') {
      window.location.replace('onboarding.html');
    }
    // Apply the saved theme before first paint — this used to only ever
    // get applied live in the session it was chosen in (setTheme() saved
    // it correctly, but nothing on reload ever read it back), so dark
    // mode silently reverted to light every time the app was reopened.
    var _savedTheme = localStorage.getItem('aquilate_theme');
    if (_savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <img src="imgs/logo.png" alt="Aq" onerror="this.outerHTML='Aq'">
    </div>
    Aquilate
  </div>
  <div class="topbar-actions">
    <button class="toolbar-btn" onclick="openModal('expense')">+ Log Expense</button>
    <button class="toolbar-btn primary" onclick="openModal('income-entry')">+ Log Income</button>
  </div>
  <div class="topbar-right">
    <div class="month-nav">
      <button class="month-nav-btn" onclick="changeMonth(-1)" title="Previous month">&#8249;</button>
      <span class="month-nav-label" id="monthLabel">—</span>
      <button class="month-nav-btn" onclick="changeMonth(1)" title="Next month">&#8250;</button>
    </div>
    <div class="settings-wrap" style="position:relative">
      <button class="settings-btn" onclick="toggleSettings(event)" title="Settings">&#9881;</button>
      <div class="settings-popup" id="settingsPopup" style="display:none"></div>
    </div>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">

    <div class="sidebar-section" style="padding-bottom:0;flex-shrink:0">
      <div class="section-label">
        Pinned Incomes
        <button class="section-add-btn" onclick="openPopover(event,'income', null, this)">+ Add</button>
      </div>
    </div>
    <div class="income-section-scroll" id="incomeList"></div>

    <div class="sidebar-section" style="flex-shrink:0">
      <div class="section-label" style="margin-bottom:10px">Summary</div>
      <div class="summary-plain">
        <div class="summary-plain-item">
          <div class="summary-plain-label">Income</div>
          <div class="summary-plain-val pos" id="totalIncome">$0.00</div>
        </div>
        <div class="summary-plain-item">
          <div class="summary-plain-label">Expenses</div>
          <div class="summary-plain-val" id="totalExpenses">$0.00</div>
        </div>
      </div>
      <div class="balance-row">
        <span class="balance-row-label">Balance</span>
        <span class="balance-row-val" id="currentBalance">$0.00</span>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto;min-height:0">
      <div class="section-label">Categories</div>
      <div class="cat-totals-list" id="catTotalsList"></div>
    </div>

    <div class="sidebar-section" style="flex-shrink:0">
      <button class="sidebar-action-btn sidebar-action-quiet" onclick="openPopover(event,'category', null, this)">+ Add Category</button>
    </div>

  </aside>

  <main class="main">
    <div class="categories-scroll">
      <div class="categories-grid" id="categoriesGrid"></div>
    </div>
  </main>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div id="modalContent"></div>
  </div>
</div>

<!-- Contextual popover — single shared panel for single-item actions
     (add/edit category, add income source, per-category income/expense).
     Fixed on <body>, positioned next to its trigger by app.js at open
     time. See openPopover()/positionPopover() in app.js. -->
<div id="popoverRoot">
  <div class="pop-panel" id="popoverPanel" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script src="persistence.js"></script>
<script src="app.js"></script>
</body>
</html>
